# Ergänzung für die bestehende docker-compose.yml.
# Der /data-Bereich bleibt dadurch bei Container-Neuerstellungen erhalten.
services:
  app:
    environment:
      SHOW_API_UI: ${SHOW_API_UI:-false}
    volumes:
      - fahrtenbuch-app-data:/data

volumes:
  fahrtenbuch-app-data:
    name: fahrtenbuch-app-data
