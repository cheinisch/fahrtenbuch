openapi: 3.1.0
info:
  title: Fahrtenbuch API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /system/health:
    get:
      summary: Healthcheck
      responses:
        "200":
          description: OK
  /system/version:
    get:
      summary: Versionsnummer
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
  /auth/login:
    post:
      summary: Anmeldung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Angemeldet }
  /users/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Aktueller Benutzer }
  /vehicles:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fahrzeuge }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Fahrzeug angelegt }
  /trips:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Fahrten }
    post:
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Fahrt angelegt }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
