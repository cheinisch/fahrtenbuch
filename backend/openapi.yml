      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
  /admin/users/{id}/passkeys:
    delete:
      tags: [Admin]
      summary: Delete all passkeys of a user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
  /admin/users/{id}/passkeys/{passkeyId}:
    delete:
      tags: [Admin]
      summary: Delete a user's passkey
      parameters:
        - $ref: '#/components/parameters/Id'
