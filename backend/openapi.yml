openapi: 3.1.0
info:
  title: Fahrtenbuch API
  version: 0.3.22
  description: |
    REST API for the self-hosted Fahrtenbuch application. It covers
    authentication, MFA, passkeys, app pairing, device management,
    users, vehicles, trips, tracking, statistics, imports and exports,
    geocoding, and centralized map service configuration.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Relative to the Fahrtenbuch server
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: MFA
  - name: Passkeys
  - name: App Pairing
  - name: Devices
  - name: Users
  - name: Vehicles
  - name: Trips
  - name: Tracking
  - name: Tags
  - name: Dashboard
  - name: Statistics
  - name: Geocoding
  - name: Services
  - name: Settings
  - name: Import Export
  - name: Admin
paths:
  /health:
    get:
      tags: [System]
      summary: Get system health
      security: []
      responses:
        '200':
          description: Systemstatus
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  database: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Erfolgreich angemeldet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Neue Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out of current session
      responses:
        '204': { description: Abgemeldet }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out of all sessions
      responses:
        '204': { description: Alle Sitzungen widerrufen }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Anfrage angenommen }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Passwort geändert }

  /auth/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Start TOTP setup
      responses:
        '200':
          description: TOTP-Konfiguration
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrCodeDataUrl: { type: string }
  /auth/mfa/totp/verify:
    post:
      tags: [MFA]
      summary: Enable TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: TOTP aktiviert }
  /auth/mfa/totp:
    delete:
      tags: [MFA]
      summary: Disable TOTP
      responses:
        '204': { description: TOTP deaktiviert }

  /auth/passkeys/register/options:
    post:
      tags: [Passkeys]
      summary: Generate passkey registration options
      responses:
        '200': { description: WebAuthn-Optionen }
  /auth/passkeys/register/verify:
    post:
      tags: [Passkeys]
      summary: Register passkey
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Passkey registriert }
  /auth/passkeys/login/options:
    post:
      tags: [Passkeys]
      summary: Generate passkey authentication options
      security: []
      responses:
        '200': { description: WebAuthn-Optionen }
  /auth/passkeys/login/verify:
    post:
      tags: [Passkeys]
      summary: Log in with passkey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Erfolgreich angemeldet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
  /auth/passkeys:
    get:
      tags: [Passkeys]
      summary: List own passkeys
      responses:
        '200': { description: Passkey-Liste }
  /auth/passkeys/{id}:
    patch:
      tags: [Passkeys]
      summary: Rename own passkey
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: Passkey aktualisiert }
    delete:
      tags: [Passkeys]
      summary: Delete passkey
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Passkey gelöscht }

  /auth/pair/options:
    post:
      tags: [App Pairing]
      summary: Create QR pairing
      responses:
        '200':
          description: Pairing-Optionen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairOptionsResponse' }
  /auth/pair:
    post:
      tags: [App Pairing]
      summary: Pair device via QR code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '200':
          description: Tokens für das gekoppelte Gerät
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/pair/{pairId}/status:
    get:
      tags: [App Pairing]
      summary: Get pairing status
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pairing-Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairStatusResponse' }
  /auth/pair/{pairId}:
    delete:
      tags: [App Pairing]
      summary: Cancel pairing
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Pairing abgebrochen }

  /users/me:
    get:
      tags: [Users]
      summary: Get own profile
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [Users]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Aktualisiertes Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/me/password:
    put:
      tags: [Users]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Passwort geändert }
  /users/me/devices:
    get:
      tags: [Devices]
      summary: List own devices
      responses:
        '200':
          description: Geräte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
  /users/me/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: Remove device and associated sessions
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Gerät entfernt }

  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles
      responses:
        '200':
          description: Fahrzeuge
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
    post:
      tags: [Vehicles]
      summary: Create vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Fahrzeug angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fahrzeug
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
    put:
      tags: [Vehicles]
      summary: Update vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '200':
          description: Fahrzeug aktualisiert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Fahrzeug gelöscht }
  /vehicles/{id}/default:
    put:
      tags: [Vehicles]
      summary: Set default vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Standardfahrzeug aktualisiert }
  /vehicles/{id}/bluetooth:
    put:
      tags: [Vehicles]
      summary: Update Bluetooth assignment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bluetoothMac]
              properties:
                bluetoothMac:
                  type: [string, 'null']
                  pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
      responses:
        '200': { description: Bluetooth-Zuordnung aktualisiert }

  /trips:
    get:
      tags: [Trips]
      summary: List trips
      parameters:
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [business, private, commute, unclassified] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Fahrten
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trip' }
    post:
      tags: [Trips]
      summary: Create trip manually
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '201':
          description: Fahrt angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
  /trips/{id}:
    get:
      tags: [Trips]
      summary: Get trip
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fahrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
    put:
      tags: [Trips]
      summary: Update trip
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '200':
          description: Fahrt aktualisiert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
    delete:
      tags: [Trips]
      summary: Delete trip
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Fahrt gelöscht }
  /trips/{id}/history:
    get:
      tags: [Trips]
      summary: Get immutable trip history
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fahrten-Historie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TripHistoryEntry' }
        '404': { description: Fahrt nicht gefunden }
  /trips/{id}/points:
    get:
      tags: [Trips]
      summary: Get trip GPS points
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: GPS-Punkte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackPoint' }
  /trips/{id}/classify:
    put:
      tags: [Trips]
      summary: Classify trip
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [business, private, commute] }
                purpose: { type: [string, 'null'] }
                contact: { type: [string, 'null'] }
      responses:
        '200': { description: Fahrt klassifiziert }
  /trips/{id}/tags:
    put:
      tags: [Trips]
      summary: Set trip tags
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Tags gesetzt }

  /tracking/start:
    post:
      tags: [Tracking]
      summary: Start tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId]
              properties:
                vehicleId: { type: string, format: uuid }
                startedAt: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Aufzeichnung gestartet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
  /tracking/points:
    post:
      tags: [Tracking]
      summary: Upload GPS points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, points]
              properties:
                tripId: { type: string, format: uuid }
                points:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/TrackPoint' }
      responses:
        '202': { description: GPS-Punkte angenommen }
  /tracking/stop:
    post:
      tags: [Tracking]
      summary: Stop tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId]
              properties:
                tripId: { type: string, format: uuid }
                endedAt: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Aufzeichnung beendet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
  /tracking/status:
    get:
      tags: [Tracking]
      summary: Get current tracking status
      responses:
        '200': { description: Trackingstatus }

  /tags:
    get:
      tags: [Tags]
      summary: List tags
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
    post:
      tags: [Tags]
      summary: Create tag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '201':
          description: Tag angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
  /tags/{id}:
    put:
      tags: [Tags]
      summary: Update tag
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '200': { description: Tag aktualisiert }
    delete:
      tags: [Tags]
      summary: Delete tag
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Tag gelöscht }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard data
      responses:
        '200': { description: Dashboarddaten }
  /language:
    get:
      tags: [System]
      summary: Get public language configuration
      security: []
      responses:
        '200':
          description: Standardsprache und unterstützte Sprachen
          content:
            application/json:
              schema:
                type: object
                required: [defaultLanguage, supportedLanguages]
                properties:
                  defaultLanguage: { type: string, enum: [de, en] }
                  supportedLanguages:
                    type: array
                    items: { type: string, enum: [de, en] }

  /vehicles/{id}/shared-trip-activity:
    get:
      tags: [Vehicles]
      summary: Get shared-user trip activity for an owned vehicle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Aggregierte Fahrtenaktivität }
        '404': { $ref: '#/components/responses/NotFound' }
  /vehicles/{id}/shares:
    get:
      tags: [Vehicles]
      summary: List confirmed vehicle shares
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Bestätigte Freigaben }
    post:
      tags: [Vehicles]
      summary: Invite vehicle share by email
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Einladung versendet }
  /vehicles/{id}/shares/{userId}:
    delete:
      tags: [Vehicles]
      summary: Revoke vehicle share
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Freigabe entfernt }
  /vehicles/{id}/share-link:
    post:
      tags: [Vehicles]
      summary: Create one-time vehicle sharing link
      description: Der Link ist 24 Stunden gültig. Nach sieben Tagen wird der Einladungsdatensatz gelöscht.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Freigabelink erstellt
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
  /vehicles/share-invitations/inspect:
    get:
      tags: [Vehicles]
      summary: Check vehicle sharing invitation
      parameters:
        - { name: token, in: query, required: true, schema: { type: string, minLength: 20 } }
      responses:
        '200': { description: Status und Metadaten der Einladung }
        '404': { $ref: '#/components/responses/NotFound' }
  /vehicles/share-invitations/pending:
    get:
      tags: [Vehicles]
      summary: Get pending email sharing invitations
      responses:
        '200': { description: Ausstehende Einladungen }
  /vehicles/share-invitations/respond:
    post:
      tags: [Vehicles]
      summary: Accept or reject vehicle share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, action]
              properties:
                token: { type: string, minLength: 20 }
                action: { type: string, enum: [accept, decline] }
      responses:
        '200': { description: Einladung beantwortet }
        '410': { description: Einladung abgelaufen }
  /vehicles/{id}/deregister:
    post:
      tags: [Vehicles]
      summary: Deregister owned vehicle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Fahrzeug abgemeldet }
  /vehicles/archive:
    get:
      tags: [Vehicles]
      summary: Get archived owned vehicles
      responses:
        '200': { description: Archivierte Fahrzeuge }
  /vehicles/{id}/restore:
    post:
      tags: [Vehicles]
      summary: Restore archived vehicle
      description: Stellt das Fahrzeug als abgemeldetes/inaktives Fahrzeug wieder her. Eine Wiederanmeldung erfolgt separat.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Fahrzeug wiederhergestellt }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{id}/register:
    post:
      tags: [Vehicles]
      summary: Re-register deregistered vehicle
      description: Startet eine neue aktive Besitzperiode; frühere Abmeldungen und Fahrten bleiben erhalten.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveAt: { type: string, format: date-time }
      responses:
        '200': { description: Fahrzeug wieder angemeldet }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Fahrzeug ist bereits aktiv }

  /vehicles/{id}/transfer:
    post:
      tags: [Vehicles]
      summary: Transfer vehicle ownership
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, transferAt]
              properties:
                account: { type: string }
                transferAt: { type: string, format: date-time }
      responses:
        '200': { description: Besitzerwechsel gespeichert }

  /odometer:
    get:
      tags: [Vehicles]
      summary: Get saved odometer readings
      responses:
        '200': { description: Kilometerstand-Ablesungen }

  /odometer/pending:
    get:
      tags: [Vehicles]
      summary: Get missing monthly odometer readings
      responses:
        '200': { description: Fehlende Messwerte }
  /odometer/{vehicleId}/{month}:
    put:
      tags: [Vehicles]
      summary: Save monthly odometer reading
      parameters:
        - in: path
          name: vehicleId
