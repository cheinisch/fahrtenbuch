          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
  /admin/users/{id}/sessions:
    delete:
      tags: [Admin]
      summary: Revoke a user's sessions
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
