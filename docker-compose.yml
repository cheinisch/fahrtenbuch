name: fahrtenbuch

services:
  app:
    image: ghcr.io/${GHCR_OWNER:-cheinisch}/${GHCR_IMAGE_NAME:-fahrtenbuch}:${IMAGE_TAG:-dev}
    container_name: fahrtenbuch-app
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    environment:
      NODE_ENV: ${APP_ENV:-production}
      PORT: ${APP_PORT:-3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fahrtenbuch}
      POSTGRES_USER: ${POSTGRES_USER:-fahrtenbuch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fahrtenbuch

  db:
    image: postgres:16-alpine
    container_name: fahrtenbuch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fahrtenbuch}
      POSTGRES_USER: ${POSTGRES_USER:-fahrtenbuch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
      TZ: ${TZ:-Europe/Berlin}
      PGTZ: ${TZ:-Europe/Berlin}
    volumes:
      - fahrtenbuch-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fahrtenbuch

volumes:
  fahrtenbuch-db-data:
    name: fahrtenbuch-db-data

networks:
  fahrtenbuch:
    name: fahrtenbuch-network
    driver: bridge