name: fahrtenbuch

services:
  app:
    image: ghcr.io/cheinisch/fahrtenbuch:${IMAGE_TAG:-latest}
    container_name: fahrtenbuch-app
    restart: unless-stopped
    pull_policy: always

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

    ports:
      - "${APP_PORT:-3000}:3000"

    volumes:
      - fahrtenbuch-backups:/data/backups

    networks:
      - fahrtenbuch

  db:
    image: postgres:16-alpine
    container_name: fahrtenbuch-db
    restart: unless-stopped

    profiles:
      - internal-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fahrtenbuch}
      POSTGRES_USER: ${POSTGRES_USER:-fahrtenbuch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}

    volumes:
      - fahrtenbuch-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - fahrtenbuch

volumes:
  fahrtenbuch-db-data:
  fahrtenbuch-backups:

networks:
  fahrtenbuch:
    driver: bridge