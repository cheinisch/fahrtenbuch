services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fahrtenbuch}
      POSTGRES_USER: ${POSTGRES_USER:-fahrtenbuch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fahrtenbuch}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fahrtenbuch} -d ${POSTGRES_DB:-fahrtenbuch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_NUMBER: ${BUILD_NUMBER:-1}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fahrtenbuch}:${POSTGRES_PASSWORD:-fahrtenbuch}@db:5432/${POSTGRES_DB:-fahrtenbuch}
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
