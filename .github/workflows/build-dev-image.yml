name: Build Dev Docker Image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push :dev
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Image-Namen vorbereiten
        id: image
        shell: bash
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "name=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker-Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev
            ${{ steps.image.outputs.name }}:dev-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Fahrtenbuch
            org.opencontainers.image.description=Development image for Fahrtenbuch
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max