name: Docker

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: fahrtenbuch-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version lesen
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < VERSION)"

          if [[ -z "$version" ]]; then
            echo "::error::Die Datei VERSION ist leer."
            exit 1
          fi

          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Buildnummer festlegen
        id: build
        shell: bash
        run: |
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Docker-Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          build-args: |
            APP_VERSION=${{ steps.version.outputs.number }}
            BUILD_NUMBER=${{ steps.build.outputs.number }}

          tags: |
            ghcr.io/${{ github.repository_owner }}/fahrtenbuch:dev
            ghcr.io/${{ github.repository_owner }}/fahrtenbuch:${{ steps.version.outputs.number }}-build${{ steps.build.outputs.number }}

          labels: |
            org.opencontainers.image.title=Fahrtenbuch
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            de.fahrtenbuch.build=${{ steps.build.outputs.number }}

          cache-from: type=gha
          cache-to: type=gha,mode=max