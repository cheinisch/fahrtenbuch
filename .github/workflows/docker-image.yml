name: Build Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fahrtenbuch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Buildnummer festlegen
        id: build_number
        shell: bash
        run: |
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Version lesen
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"

          if [[ -z "$version" ]]; then
            echo "Die Datei VERSION ist leer."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Tags vorbereiten
        id: tags
        shell: bash
        run: |
          image="ghcr.io/cheinisch/fahrtenbuch"
          version="${{ steps.version.outputs.value }}"
          build="${{ steps.build_number.outputs.number }}"

          {
            echo "value<<EOF"
            echo "${image}:dev"
            echo "${image}:${version}-build${build}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_NUMBER=${{ steps.build_number.outputs.number }}
          labels: |
            org.opencontainers.image.title=Fahrtenbuch
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            de.fahrtenbuch.build=${{ steps.build_number.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max