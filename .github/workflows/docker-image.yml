name: Build Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: fahrtenbuch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buildnummer erhöhen
        id: build_number
        shell: bash
        run: |
          current="$(tr -d '[:space:]' < BUILD)"
          next=$((current + 1))
          printf '%s\n' "$next" > BUILD
          echo "number=$next" >> "$GITHUB_OUTPUT"

      - name: Buildnummer zurückschreiben
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD
          git commit -m "chore: build ${{ steps.build_number.outputs.number }} [skip ci]" || exit 0
          git push

      - name: Version lesen
        id: version
        shell: bash
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Tags vorbereiten
        id: tags
        shell: bash
        run: |
          image="ghcr.io/cheinisch/fahrtenbuch"
          version="${{ steps.version.outputs.value }}"
          build="${{ steps.build_number.outputs.number }}"

          {
            echo 'value<<EOF'
            echo "${image}:dev"
            echo "${image}:${version}-build${build}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=Fahrtenbuch
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            de.fahrtenbuch.build=${{ steps.build_number.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max