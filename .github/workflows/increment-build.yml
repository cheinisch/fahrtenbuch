name: Increment Build Number

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: increment-build-number
  cancel-in-progress: false

jobs:
  increment:
    if: "${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore: bump build') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Buildnummer erhöhen
        id: build
        shell: bash
        run: |
          set -euo pipefail

          git pull --ff-only origin main

          CURRENT="$(tr -d '[:space:]' < BUILD)"
          if [[ ! "$CURRENT" =~ ^[0-9]+$ ]]; then
            echo "Ungültige Buildnummer in BUILD: $CURRENT"
            exit 1
          fi

          NEXT=$((CURRENT + 1))
          printf '%s\n' "$NEXT" > BUILD

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version in VERSION: $VERSION"
            exit 1
          fi

          DEV_VERSION="${VERSION}-dev.${NEXT}"
          npm version "$DEV_VERSION" --no-git-tag-version --allow-same-version
          npm version "$DEV_VERSION" --workspace backend --no-git-tag-version --allow-same-version
          npm version "$DEV_VERSION" --workspace frontend --no-git-tag-version --allow-same-version
          npm version "$DEV_VERSION" --workspace shared --no-git-tag-version --allow-same-version

          node - "$NEXT" <<'NODE'
          const fs = require("fs");
          const build = Number(process.argv[2]);
          for (const file of ["package.json", "backend/package.json", "frontend/package.json", "shared/package.json"]) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.build = build;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          }
          NODE

          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Build $CURRENT -> $NEXT"

      - name: Buildnummer committen
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add BUILD package.json package-lock.json backend/package.json frontend/package.json shared/package.json
          git commit -m "chore: bump build to ${BUILD_NUMBER}"
          git push origin HEAD:main
