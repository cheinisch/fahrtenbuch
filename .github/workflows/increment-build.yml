name: Increment Build Number

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: increment-build-number
  cancel-in-progress: false

jobs:
  increment:
    if: ${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore: bump build') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Buildnummer erhöhen
        id: build
        shell: bash
        run: |
          set -euo pipefail

          git pull --ff-only origin main

          CURRENT="$(tr -d '[:space:]' < BUILD)"
          if [[ ! "$CURRENT" =~ ^[0-9]+$ ]]; then
            echo "Ungültige Buildnummer in BUILD: $CURRENT"
            exit 1
          fi

          NEXT=$((CURRENT + 1))
          printf '%s\n' "$NEXT" > BUILD

          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Build $CURRENT -> $NEXT"

      - name: Buildnummer committen
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add BUILD
          git commit -m "chore: bump build to ${BUILD_NUMBER}"
          git push origin HEAD:main
