openapi: 3.1.0
info:
  title: Fahrtenbuch API
  version: 0.5.2
  description: |
    REST API for the self-hosted Fahrtenbuch application. It covers
    authentication, MFA, passkeys, app pairing, device management,
    users, vehicles, trips, tracking, statistics, imports and exports,
    geocoding, and centralized map service configuration.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Relative to the Fahrtenbuch server
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: MFA
  - name: Passkeys
  - name: Linked Accounts
    description: >-
      Anmeldung mit verknüpftem Google- oder Microsoft-Konto (OpenID Connect).
      Nur bestehende Benutzer können ein Konto verknüpfen; eine Selbstregistrierung gibt es nicht.
  - name: App Pairing
  - name: Devices
  - name: Users
  - name: Vehicles
  - name: Expenses
    description: Tanken/Laden und sonstige Fahrzeugkosten (nur Fahrzeughalter).
  - name: Trips
  - name: Tracking
  - name: Tags
  - name: Dashboard
  - name: Statistics
  - name: Geocoding
  - name: Services
  - name: Settings
  - name: Import Export
  - name: Admin
paths:
  /auth/methods:
    get:
      tags: [Auth]
      summary: List sign-in methods offered by this server
      description: >-
        TOTP und Passkeys lassen sich serverweit per `TOTP_ENABLED` bzw.
        `PASSKEYS_ENABLED` abschalten. Abgeschaltet antworten die zugehörigen
        Endpunkte mit 403 (`TOTP_DISABLED` / `PASSKEYS_DISABLED`), und bei der
        Anmeldung wird ein eingerichtetes TOTP nicht abgefragt.
      security: []
      responses:
        '200':
          description: Verfügbare Anmeldeverfahren
          content:
            application/json:
              schema:
                type: object
                required: [password, totp, passkeys, oauthProviders]
                properties:
                  password: { type: boolean }
                  totp: { type: boolean }
                  passkeys: { type: boolean }
                  oauthProviders:
                    type: array
                    items: { type: string, enum: [google, microsoft] }
  /health:
    get:
      tags: [System]
      summary: Get system health
      security: []
      responses:
        '200':
          description: Systemstatus
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  database: { type: string }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Erfolgreich angemeldet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Neue Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out of current session
      responses:
        '204': { description: Abgemeldet }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out of all sessions
      responses:
        '204': { description: Alle Sitzungen widerrufen }
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Anfrage angenommen }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Passwort geändert }

  /auth/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Start TOTP setup
      responses:
        '200':
          description: TOTP-Konfiguration
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrCodeDataUrl: { type: string }
  /auth/mfa/totp/verify:
    post:
      tags: [MFA]
      summary: Enable TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: TOTP aktiviert }
  /auth/mfa/totp:
    delete:
      tags: [MFA]
      summary: Disable TOTP
      responses:
        '204': { description: TOTP deaktiviert }

  /auth/passkeys/register/options:
    post:
      tags: [Passkeys]
      summary: Generate passkey registration options
      responses:
        '200': { description: WebAuthn-Optionen }
  /auth/passkeys/register/verify:
    post:
      tags: [Passkeys]
      summary: Register passkey
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Passkey registriert }
  /auth/passkeys/login/options:
    post:
      tags: [Passkeys]
      summary: Generate passkey authentication options
      security: []
      responses:
        '200': { description: WebAuthn-Optionen }
  /auth/passkeys/login/verify:
    post:
      tags: [Passkeys]
      summary: Log in with passkey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Erfolgreich angemeldet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
  /auth/passkeys:
    get:
      tags: [Passkeys]
      summary: List own passkeys
      responses:
        '200': { description: Passkey-Liste }
  /auth/passkeys/{id}:
    patch:
      tags: [Passkeys]
      summary: Rename own passkey
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: Passkey aktualisiert }
    delete:
      tags: [Passkeys]
      summary: Delete passkey
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Passkey gelöscht }

  /auth/oauth/providers:
    get:
      tags: [Linked Accounts]
      summary: List external sign-in providers
      description: Ein Anbieter ist aktiv, wenn auf dem Server Client-ID und Secret gesetzt sind.
      security: []
      responses:
        '200':
          description: Anbieterliste
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, enabled]
                  properties:
                    id: { type: string, enum: [google, microsoft] }
                    name: { type: string }
                    enabled: { type: boolean }
  /auth/oauth/{provider}/login:
    post:
      tags: [Linked Accounts]
      summary: Start sign-in with an external provider
      description: |-
        Liefert die Autorisierungs-URL des Anbieters.

        **Web:** ohne Request-Body. Der Server setzt einen kurzlebigen
        HttpOnly-Cookie, der den Callback an diesen Browser bindet; der Client
        leitet im selben Browser auf `authorizationUrl` weiter.

        **Mobile App:** mit `appRedirectUri` und `appCodeChallenge`. Die App
        erzeugt einen zufälligen Verifier (43–128 Zeichen, PKCE nach RFC 7636),
        sendet `appCodeChallenge = BASE64URL(SHA256(verifier))` und öffnet
        `authorizationUrl` in einem Custom Tab. Nach der Anmeldung leitet der
        Server auf `appRedirectUri?ticket=…` weiter (bei Fehlern
        `appRedirectUri?error=<CODE>`). Die App löst das Ticket zusammen mit
        dem Verifier über `POST /auth/oauth/exchange` ein. Die Serveradresse
        muss die App vorher kennen.

        `appRedirectUri` muss auf dem Server freigegeben sein
        (`OAUTH_APP_REDIRECT_URIS`, Standard `fahrtenbuch://oauth/callback`).
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                appRedirectUri:
                  type: string
                  maxLength: 300
                  example: fahrtenbuch://oauth/callback
                appCodeChallenge:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
                  description: S256-Challenge des App-Verifiers (Base64url ohne Padding).
      responses:
        '200':
          description: Autorisierungs-URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationResponse' }
        '400':
          description: >-
            Rücksprungadresse nicht freigegeben (`OAUTH_APP_REDIRECT_NOT_ALLOWED`)
            oder ungültiger Challenge (`VALIDATION_ERROR`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/oauth/{provider}/link:
    post:
      tags: [Linked Accounts]
      summary: Start linking an external account
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '200':
          description: Autorisierungs-URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/oauth/{provider}/callback:
    get:
      tags: [Linked Accounts]
      summary: Redirect target of the provider
      description: >-
        Wird vom Browser nach der Anmeldung beim Anbieter aufgerufen und leitet
        zurück zur Web-App: Anmeldung nach `/login#oauthTicket=…`,
        Verknüpfung nach `/profilesettings?oauthLinked=<provider>`, Fehler mit
        `?oauthError=<CODE>` (z. B. OAUTH_NOT_LINKED, OAUTH_CANCELLED,
        OAUTH_STATE_INVALID, OAUTH_IDENTITY_IN_USE, OAUTH_PROVIDER_ALREADY_LINKED).
        Wurde die Anmeldung aus der App gestartet, geht die Weiterleitung an
        `appRedirectUri?ticket=…` bzw. `appRedirectUri?error=<CODE>`.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303': { description: Weiterleitung zur Web-App }
  /auth/oauth/exchange:
    post:
      tags: [Linked Accounts]
      summary: Exchange a sign-in ticket for tokens
      description: >-
        Tauscht das Einmal-Ticket aus dem Callback gegen Tokens. Ist TOTP aktiv,
        antwortet der Server zuerst mit `MFA_REQUIRED`; das Ticket bleibt dann
        bis zu seinem Ablauf (5 Minuten) gültig. Tickets aus einer
        App-Anmeldung lassen sich nur mit dem passenden `appCodeVerifier`
        einlösen (sonst `OAUTH_APP_VERIFIER_INVALID`); das Gerät wird dann als
        `mobile` registriert.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string, minLength: 20, maxLength: 200 }
                totpCode: { type: [string, 'null'], pattern: '^\\d{6}$' }
                appCodeVerifier:
                  type: [string, 'null']
                  pattern: '^[A-Za-z0-9._~-]{43,128}$'
                  description: Pflicht für Tickets aus einer App-Anmeldung.
                deviceId: { type: [string, 'null'], maxLength: 200 }
                deviceName: { type: [string, 'null'], maxLength: 120 }
                platform: { type: [string, 'null'], maxLength: 64 }
                appVersion: { type: [string, 'null'], maxLength: 64 }
      responses:
        '200':
          description: Erfolgreich angemeldet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/oauth/identities:
    get:
      tags: [Linked Accounts]
      summary: List own linked accounts
      responses:
        '200':
          description: Verknüpfte Konten
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LinkedAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/oauth/identities/{id}:
    delete:
      tags: [Linked Accounts]
      summary: Unlink an external account
      description: >-
        Schlägt mit `LAST_LOGIN_METHOD` (409) fehl, wenn das Konto weder ein
        Passwort noch einen Passkey oder ein weiteres verknüpftes Konto hat.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Verknüpfung getrennt }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Letzte Anmeldemöglichkeit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/pair/options:
    post:
      tags: [App Pairing]
      summary: Create QR pairing
      responses:
        '200':
          description: Pairing-Optionen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairOptionsResponse' }
  /auth/pair:
    post:
      tags: [App Pairing]
      summary: Pair device via QR code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '200':
          description: Tokens für das gekoppelte Gerät
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /auth/pair/{pairId}/status:
    get:
      tags: [App Pairing]
      summary: Get pairing status
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pairing-Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairStatusResponse' }
  /auth/pair/{pairId}:
    delete:
      tags: [App Pairing]
      summary: Cancel pairing
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Pairing abgebrochen }

  /users/me:
    get:
      tags: [Users]
      summary: Get own profile
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [Users]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Aktualisiertes Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/me/password:
    put:
      tags: [Users]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Passwort geändert }
  /users/me/devices:
    get:
      tags: [Devices]
      summary: List own devices
      responses:
        '200':
          description: Geräte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
  /users/me/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: Remove device and associated sessions
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Gerät entfernt }

  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles
      responses:
        '200':
          description: Fahrzeuge
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
    post:
      tags: [Vehicles]
      summary: Create vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Fahrzeug angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fahrzeug
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
    put:
      tags: [Vehicles]
      summary: Update vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '200':
          description: Fahrzeug aktualisiert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Fahrzeug gelöscht }
  /vehicles/{id}/default:
    put:
      tags: [Vehicles]
      summary: Set default vehicle
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Standardfahrzeug aktualisiert }
  /vehicles/{id}/bluetooth:
    put:
      tags: [Vehicles]
      summary: Update Bluetooth assignment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bluetoothMac]
              properties:
                bluetoothMac:
                  type: [string, 'null']
                  pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
      responses:
        '200': { description: Bluetooth-Zuordnung aktualisiert }

  /trips:
    get:
      tags: [Trips]
      summary: List trips
      parameters:
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [business, private, commute, unclassified] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Fahrten
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trip' }
    post:
      tags: [Trips]
      summary: Create trip manually
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '201':
          description: Fahrt angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
  /trips/{id}:
    get:
      tags: [Trips]
      summary: Get trip
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fahrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
    put:
      tags: [Trips]
      summary: Update trip
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '200':
          description: Fahrt aktualisiert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
    delete:
      tags: [Trips]
      summary: Delete trip
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Fahrt gelöscht }
  /trips/{id}/history:
    get:
      tags: [Trips]
      summary: Get immutable trip history
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fahrten-Historie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TripHistoryEntry' }
        '404': { description: Fahrt nicht gefunden }
  /trips/{id}/matched-route:
    get:
      tags: [Trips]
      summary: Get map-matched route
      description: Auf das Straßennetz gelegte Route aus dem Map-Matching. Die GPS-Rohpunkte bleiben unter /trips/{id}/points unverändert.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Gematchte Route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripMatchedRoute' }
        '404': { description: Fahrt nicht gefunden oder noch nicht gematcht (MAP_MATCH_NOT_FOUND) }
  /trips/{id}/points:
    get:
      tags: [Trips]
      summary: Get trip GPS points
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: GPS-Punkte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackPoint' }
  /trips/{id}/classify:
    put:
      tags: [Trips]
      summary: Classify trip
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [business, private, commute] }
                specialCategory:
                  type: [string, 'null']
                  enum: [medical, volunteer, education, application, moving, other, null]
                  description: Optional secondary purpose category; null removes it.
                purpose:
                  type: [string, 'null']
                  maxLength: 1000
                  description: Trip purpose. Only changed when present; null or "" removes it.
                contact:
                  type: [string, 'null']
                  maxLength: 1000
                  description: Business contact / visited person. Only changed when present; null or "" removes it.
                notes:
                  type: [string, 'null']
                  maxLength: 20000
                  description: Free-text note. Only changed when present; null or "" removes it.
      responses:
        '200': { description: Fahrt klassifiziert }
  /trips/{id}/tags:
    put:
      tags: [Trips]
      summary: Set trip tags
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagIds]
              properties:
                tagIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Tags gesetzt }

  /tracking/start:
    post:
      tags: [Tracking]
      summary: Start tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId]
              properties:
                vehicleId: { type: string, format: uuid }
                clientTripId:
                  type: [string, 'null']
                  format: uuid
                  description: Trip ID generated by the device when the trip starts. A repeated start with the same ID returns the existing trip (200) instead of creating a new one.
                startedAt: { type: [string, 'null'], format: date-time }
                timeZone:
                  type: [string, 'null']
                  example: Europe/Berlin
                  description: IANA time zone of the device at trip start. Stored as zone id, so daylight saving time is applied per timestamp.
      responses:
        '200':
          description: Diese Fahrt existiert bereits (gleiche clientTripId; ohne clientTripId gleiches Fahrzeug und gleiches startedAt einer laufenden Aufzeichnung), z. B. weil die Antwort auf einen früheren Start verloren ging. Liefert die bestehende Fahrt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '201':
          description: Aufzeichnung gestartet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '409':
          description: Es läuft bereits eine andere Aufzeichnung (TRACKING_ALREADY_ACTIVE). details enthält tripId, clientTripId, sameDevice (vom selben Gerät gestartet), vehicleId und startedAt, damit die App eigene, lokal schon beendete oder verworfene Fahrten beenden bzw. löschen kann.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
