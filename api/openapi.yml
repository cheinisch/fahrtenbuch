components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, microsoft] }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Nicht authentifiziert
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Keine Berechtigung
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    OAuthAuthorizationResponse:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string, format: uri }
    LinkedAccount:
      type: object
      required: [id, provider, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, microsoft] }
        email: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details: { type: [object, array, 'null'] }
        requestId: { type: [string, 'null'] }
    User:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        loginName: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'], maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, disabled] }
        locale: { type: string, default: de }
        timezone: { type: string, default: Europe/Berlin }
        themeMode: { type: string, enum: [light, dark, system] }
        totpEnabled: { type: boolean }
        totpRequired: { type: boolean }
        passkeyEnabled: { type: boolean }
        hasPassword: { type: boolean }
        forcePasswordChange: { type: boolean }
        onboardingCompleted: { type: boolean, description: "false: beim Login den Einrichtungsassistenten zeigen" }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPasskey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        transports:
          type: array
          items: { type: string }
        backedUp: { type: boolean }
        deviceType: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            passkeyCount: { type: integer, minimum: 0 }
            activeDeviceCount: { type: integer, minimum: 0 }
            vehicleCount: { type: integer, minimum: 0 }
            tripCount: { type: integer, minimum: 0 }
            passkeys:
              type: array
              items: { $ref: '#/components/schemas/AdminPasskey' }
    UserUpdate:
      type: object
      properties:
        loginName: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        locale: { type: string }
    AdminUserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        loginName: { type: [string, 'null'], minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: [string, 'null'], maxLength: 120 }
        firstName: { type: [string, 'null'], maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        role: { type: string, enum: [user, admin], default: user }
        status: { type: string, enum: [active, disabled], default: active }
        locale: { type: string, default: de }
        timezone: { type: string, default: Europe/Berlin }
        themeMode: { type: string, enum: [light, dark, system], default: system }
        forcePasswordChange: { type: boolean, default: true }
        totpRequired: { type: boolean, default: false }
        passkeyEnabled: { type: boolean, default: true }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string, format: password }
        totpCode: { type: [string, 'null'], pattern: '^[0-9]{6}$' }
        deviceName: { type: [string, 'null'] }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        tokenType: { type: string, const: Bearer }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    Device:
      type: object
      required: [deviceId, lastUsedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PairOptionsResponse:
      type: object
      required: [pairId, payload, qrCodeDataUrl, expiresAt]
      properties:
        pairId: { type: string, format: uuid }
        payload: { type: string }
        qrCodeDataUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    PairRequest:
      type: object
      required: [pairId, pairToken, deviceId, deviceName, platform]
      properties:
        pairId: { type: string, format: uuid }
        pairToken: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        platform: { type: string, example: android }
        appVersion: { type: [string, 'null'] }
    PairStatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, completed, expired, cancelled] }
        tokens:
          oneOf:
            - $ref: '#/components/schemas/TokenPair'
            - type: 'null'
    Vehicle:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        licensePlate: { type: [string, 'null'] }
        vin: { type: [string, 'null'] }
        odometerKm: { type: [number, 'null'], minimum: 0 }
        color: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        bluetoothMac: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehicleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        licensePlate: { type: [string, 'null'] }
        vin: { type: [string, 'null'] }
        odometerKm: { type: [number, 'null'], minimum: 0 }
        color: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        bluetoothMac:
          type: [string, 'null']
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
    Trip:
      type: object
      required: [id, vehicleId, type, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        type: { type: string, enum: [business, private, commute, unclassified] }
        specialCategory:
          type: [string, 'null']
          enum: [medical, volunteer, education, application, moving, other, null]
          description: Optional secondary purpose category independent of the primary trip type.
        status: { type: string, enum: [recording, completed, cancelled] }
        clientTripId:
          type: [string, 'null']
          format: uuid
          description: Trip ID generated by the recording device at start (sent as clientTripId to /tracking/start).
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        startTimeZone:
          type: [string, 'null']
          example: Europe/Berlin
          description: IANA time zone in which the trip started. Falls back to the user's time zone. Format startedAt in this zone to show local time (DST-aware).
        endTimeZone:
          type: [string, 'null']
          example: Europe/Berlin
          description: IANA time zone in which the trip ended. Falls back to startTimeZone, then the user's time zone.
        timeZoneSource:
          type: [string, 'null']
          enum: [trip, user, null]
          description: trip = recorded with the trip, user = fallback to the account time zone.
        startAddress: { type: [string, 'null'] }
        endAddress: { type: [string, 'null'] }
        purpose: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        distanceKm: { type: [number, 'null'] }
        durationSeconds: { type: [integer, 'null'] }
        mapMatching:
          description: Ergebnis des Map-Matchings (null = noch nicht gematcht). Bei status applied ist distanceKm die gematchte Distanz.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TripMapMatchingSummary'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TripMapMatchingSummary:
      type: object
      required: [status, provider]
      properties:
        status: { type: string, enum: [applied, rejected, failed] }
        provider: { type: string, enum: [valhalla, osrm, atlas] }
        matchedAt: { type: string, format: date-time }
        rawDistanceMeters: { type: [integer, 'null'], description: Distanz aus den GPS-Rohpunkten }
        matchedDistanceMeters: { type: [integer, 'null'] }
        message: { type: [string, 'null'], description: Grund bei rejected/failed }
    TripMatchedRoute:
      allOf:
        - $ref: '#/components/schemas/TripMapMatchingSummary'
        - type: object
          required: [tripId, coordinates]
          properties:
            tripId: { type: string, format: uuid }
            pointCount: { type: integer }
            confidence: { type: [number, 'null'] }
            coordinates:
              type: array
              description: Route auf dem Straßennetz als [lat, lon]-Paare
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
    TripHistoryEntry:
      type: object
      required: [id, tripId, eventType, changedFields, metadata, createdAt]
      properties:
        id: { type: string }
        tripId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [CREATED, UPDATED, CLASSIFIED, ARCHIVED, DELETED, TAG_ADDED, TAG_REMOVED, MAP_MATCHED, BASELINE, TRIP_SPLIT, TRIP_MERGED, ROUTE_CORRECTED, AUTO_CLASSIFIED]
        changedFields: { type: object, additionalProperties: true }
        oldValues: { type: [object, 'null'], additionalProperties: true }
        newValues: { type: [object, 'null'], additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        actor:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, format: uuid }
                displayName: { type: [string, 'null'] }
                username: { type: [string, 'null'] }
                email: { type: [string, 'null'], format: email }
        createdAt: { type: string, format: date-time }
    TripInput:
      type: object
      required: [vehicleId, startedAt]
      properties:
        vehicleId: { type: string, format: uuid }
        type: { type: string, enum: [business, private, commute, unclassified], default: unclassified }
        specialCategory:
          type: [string, 'null']
          enum: [medical, volunteer, education, application, moving, other, null]
          description: Optional secondary purpose category independent of the primary trip type.
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        startTimeZone: { type: [string, 'null'], example: Europe/Berlin, description: 'IANA time zone; omitted = keep (update) or account time zone (create).' }
        endTimeZone: { type: [string, 'null'], example: Europe/Berlin, description: 'IANA time zone; defaults to startTimeZone.' }
        startAddress: { type: [string, 'null'] }
        endAddress: { type: [string, 'null'] }
        purpose: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
    TrackPoint:
      type: object
      required: [lat, lon, recordedAt]
      properties:
        id: { type: [string, 'null'], format: uuid }
        tripId: { type: [string, 'null'], format: uuid }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        altitude: { type: [number, 'null'] }
        accuracy: { type: [number, 'null'] }
        speed: { type: [number, 'null'] }
        bearing: { type: [number, 'null'] }
        recordedAt: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: [string, 'null'] }
    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: [string, 'null'] }
    ServiceConfiguration:
      type: object
      required: [map, geocoding, overpass, updatedAt]
      properties:
        map: { $ref: '#/components/schemas/PublicMapConfig' }
        geocoding:
          type: object
          required: [searchEndpoint, reverseEndpoint]
          properties:
            enabled: { type: boolean, description: "false, wenn die Adresssuche serverseitig deaktiviert ist" }
            searchEndpoint: { type: string, example: /api/v1/geocoding/search }
            reverseEndpoint: { type: string, example: /api/v1/geocoding/reverse }
        overpass:
          type: object
          required: [nearbyEndpoint, searchRadiusMeters, maxResults]
          properties:
            nearbyEndpoint: { type: string, example: /api/v1/geocoding/nearby }
            searchRadiusMeters: { type: integer, example: 2500 }
            maxResults: { type: integer, example: 50 }
        updatedAt: { type: string, format: date-time }
        features:
          type: object
          description: Serverseitig aktivierte Funktionen. Fehlt ein Schlüssel, gilt die Funktion als nicht verfügbar.
          properties:
            expenses: { type: boolean, description: Kostenerfassung (/expenses). Derzeit nur im dev-Image aktiv. }
        channel: { type: string, enum: [dev, release] }
        setup:
          type: object
          properties:
            completed: { type: boolean, description: Ersteinrichtung des Servers abgeschlossen }
        mail:
          type: object
          properties:
            enabled: { type: boolean, description: "SMTP eingerichtet; false: E-Mail-Funktionen ausblenden" }
        gravatar:
          type: object
          properties:
            enabled: { type: boolean, description: Gravatar-Profilbilder auf dieser Instanz erlaubt }
    MailSettings:
      type: object
      properties:
        source: { type: string, enum: [database, environment, none] }
        configured: { type: boolean }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        passwordSet: { type: boolean }
        fromAddress: { type: string }
        fromName: { type: string }
    MailSettingsUpdate:
      type: object
      required: [host, fromAddress]
      properties:
        host: { type: string }
        port: { type: integer, default: 587 }
        security: { type: string, enum: [starttls, tls, none], default: starttls }
        username: { type: [string, 'null'] }
        password: { type: [string, 'null'], format: password, description: Leer = unverändert }
        clearPassword: { type: boolean }
        fromAddress: { type: string, format: email }
        fromName: { type: [string, 'null'] }
    AdminSetupState:
      type: object
      properties:
        completed: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
        environment:
          type: object
          properties:
            publicBaseUrl: { type: string }
            publicBaseUrlConfigured: { type: boolean }
            timezone: { type: string }
            oauth:
              type: object
              properties:
                google: { type: boolean }
                microsoft: { type: boolean }
                redirectUriTemplate: { type: string }
            passkeys:
              type: object
              properties:
                enabled: { type: boolean }
                rpId: { type: string }
            channel: { type: string, enum: [dev, release] }
        mail: { $ref: '#/components/schemas/MailSettings' }
        gravatar:
          type: object
          properties:
            enabled: { type: boolean }
            source: { type: string, enum: [database, environment] }
    PublicMapConfig:
      type: object
      required: [provider, type, attribution, minZoom, maxZoom, tileSize]
      properties:
        provider: { type: string, enum: [osm, maplibre, custom] }
        type: { type: string, enum: [raster, vector, style] }
        tileUrl: { type: [string, 'null'], format: uri }
        styleUrl: { type: [string, 'null'], format: uri }
        attribution: { type: string }
        minZoom: { type: integer }
        maxZoom: { type: integer }
        tileSize: { type: integer, enum: [256, 512] }
    PersonalSettings:
      type: object
      description: User preferences. Unspecified distanceUnit defaults to km.
      properties:
        distanceUnit:
          type: string
          enum: [km, mi]
          default: km
          description: Preferred distance display unit. Stored trip distances remain in kilometers.
        dateFormat:
          type: string
          enum: [EU, US]
          default: EU
          description: Preferred date display format. Does not change stored timestamps or API ISO dates.
        speedUnit:
          type: string
          enum: [kmh, mph]
          default: kmh
          description: Preferred speed display unit (km/h or mph). Stored measurements are unchanged.
        timeFormat:
          type: string
          enum: [12h, 24h]
          default: 24h
          description: Preferred clock display format. Stored timestamps and API ISO dates are unchanged.
        gravatarEnabled:
          type: boolean
          default: true
          description: Show the user's Gravatar (looked up by the hashed e-mail address) as profile picture in web and app. Can be changed via PATCH.
        gravatarAvailable:
          type: boolean
          readOnly: true
          description: False when the instance disables Gravatar (environment variable GRAVATAR_ENABLED=false); clients must not load Gravatar images then.
      additionalProperties: true

    MapServiceSettings:
      allOf:
        - $ref: '#/components/schemas/PublicMapConfig'
    PhotonServiceSettings:
      type: object
      required: [provider, timeoutMs]
      properties:
        provider:
          type: string
          enum: [disabled, public, custom, atlas]
          description: "disabled schaltet die Adresssuche ab; atlas nutzt den Photon-Passthrough von Dawarich Atlas."
        baseUrl: { type: [string, 'null'] }
        timeoutMs: { type: integer, minimum: 1000, default: 10000 }
    OverpassServiceSettings:
      type: object
      required: [provider, timeoutMs, searchRadiusMeters, maxResults]
      properties:
        provider: { type: string, enum: [public, custom] }
        interpreterUrl: { type: [string, 'null'] }
        timeoutMs: { type: integer, minimum: 1000, default: 30000 }
        searchRadiusMeters: { type: integer, minimum: 1, default: 2500 }
        maxResults: { type: integer, minimum: 1, maximum: 500, default: 50 }
    AdminServiceSettings:
      type: object
      required: [map, photon, overpass]
      properties:
        map: { $ref: '#/components/schemas/MapServiceSettings' }
        photon: { $ref: '#/components/schemas/PhotonServiceSettings' }
        overpass: { $ref: '#/components/schemas/OverpassServiceSettings' }
        atlas: { $ref: '#/components/schemas/AtlasServiceSettings' }
        mapMatching: { $ref: '#/components/schemas/MapMatchingSettings' }
    AtlasServiceSettings:
      type: object
      description: Dawarich Atlas – bündelt Photon (Geocoding) und Valhalla (Routing/Map-Matching).
      required: [enabled, timeoutMs]
      properties:
        enabled: { type: boolean, default: false }
        baseUrl: { type: string, example: "http://192.168.1.20:8484" }
        timeoutMs: { type: integer, minimum: 1000, maximum: 120000, default: 10000 }
    MapMatchingSettings:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [disabled, valhalla, osrm, atlas] }
        osrmUrl: { type: string }
        valhallaUrl: { type: string }
    ServiceCheckResult:
      type: object
      required: [checkedAt, modules]
      properties:
        checkedAt: { type: string, format: date-time }
        modules:
          type: array
          items:
            type: object
            required: [module, label, provider, state, message]
            properties:
              module: { type: string, enum: [atlas, geocoding, mapMatching] }
              label: { type: string }
              provider: { type: string, example: atlas }
              providerLabel: { type: string }
              state: { type: string, enum: [available, starting, unavailable, inactive, misconfigured] }
              message: { type: string }
              details:
                type: [object, 'null']
                description: Bei Atlas Version, Gesamtstatus und Fähigkeiten (geocoding, routing, pois, transit → up/starting/down).
                additionalProperties: true
              responseTimeMs: { type: [integer, 'null'] }
 }
      responses:
        '200': { description: Kilometerstand gespeichert }
  /statistics/odometer-intervals:
    get:
      tags: [Statistics]
      summary: Evaluate accuracy between odometer readings
      parameters:
        - { name: vehicleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Kilometer- und Fahrtenwerte je Ableseintervall. trackedKm enthält Fahrten freigegebener Fahrer während der eigenen Halterschaft; deren Summe steht zusätzlich in otherDriversKm (ohne Kategorien). }

  /statistics/monthly-odometer:
    get:
      tags: [Statistics]
      summary: Monthly statistics with odometer and untracked distance
      responses:
        '200': { description: Monatliche Kilometerstatistik je Fahrzeug, inkl. geteilter Fahrzeuge (access = owner|shared). Für Besitzer enthält trackedKm Fahrten freigegebener Fahrer während der eigenen Halterschaft, deren Summe zusätzlich in otherDriversKm steht (ohne Kategorien). Bei geteilten Fahrzeugen nur die eigenen Fahrten, ohne Ablesungen (actualKm/unknownKm null). }

  /trips/{id}/split:
    post:
      tags: [Trips]
      summary: Split trip at a GPS point
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Geteilte Fahrten }
  /trips/merge:
    post:
      tags: [Trips]
      summary: Merge trips of the same vehicle
      responses:
        '200': { description: Zusammengeführte Fahrt }

  /places:
    get:
      tags: [Places]
      summary: Get saved places
      responses:
        '200': { description: Gespeicherte Orte }
    post:
      tags: [Places]
      summary: Save place for classification suggestions
      responses:
        '201': { description: Ort gespeichert }
  /trips/{id}/assignable-drivers:
    get:
      tags: [Trips]
      summary: Get eligible drivers for trip assignment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Zulässige Fahrer und Rückgabeoptionen }
  /trips/{id}/assign-driver:
    post:
      tags: [Trips]
      summary: Assign trip driver or return to vehicle owner
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Fahrerzuordnung aktualisiert }

  /trips/{id}/suggestions:
    get:
      tags: [Trips]
      summary: Get location-based classification suggestions
      responses:
        '200': { description: Vorschläge }
  /trips/{id}/route-correction:
    post:
      tags: [Trips]
      summary: Correct trip route manually
      responses:
        '200': { description: Korrigierte Fahrt }

  /statistics:
    get:
      tags: [Statistics]
      summary: Get statistics
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [business, private, commute, unclassified] } }
      responses:
        '200': { description: Statistiken }
  /statistics/monthly:
    get:
      tags: [Statistics]
      summary: Get monthly statistics
      responses:
        '200': { description: Monatsstatistik }
  /statistics/vehicles:
    get:
      tags: [Statistics]
      summary: Get vehicle statistics
      responses:
        '200': { description: Fahrzeugstatistik }

  /config/services:
    get:
      tags: [Services]
      summary: Get public client configuration
      description: |
        Liefert nur die für Clients benötigte Konfiguration. Interne Photon-
        und Overpass-URLs werden nicht ausgegeben. Web und Android verwenden
        ausschließlich die Fahrtenbuch-Geocoding-Endpunkte.
      security: []
      responses:
        '200':
          description: Client-Konfiguration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceConfiguration' }
  /geocoding/search:
    get:
      tags: [Geocoding]
      summary: Search places using configured Photon service
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: lang, in: query, schema: { type: string, default: de } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200': { description: Suchergebnisse }
  /geocoding/reverse:
    get:
      tags: [Geocoding]
      summary: Reverse geocode using configured Photon service
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: lang, in: query, schema: { type: string, default: de } }
      responses:
        '200': { description: Adresse beziehungsweise Ort }
  /geocoding/nearby:
    get:
      tags: [Geocoding]
      summary: Search POIs using configured Overpass service
      description: Die API erzeugt die Overpass-QL-Abfrage selbst. Freie Abfragen durch Clients sind nicht erlaubt.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [sight, restaurant, hotel, park, fuel, parking, supermarket, charging_station, hospital, pharmacy]
      responses:
        '200': { description: POI-Ergebnisse }

  /settings:
    get:
      tags: [Settings]
      summary: Get personal settings
      responses:
        '200': { description: Einstellungen }
    put:
      tags: [Settings]
      summary: Update personal settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Einstellungen aktualisiert }

  /compliance/checks:
    get:
      tags: [Trips]
      summary: Check trip plausibility and completeness
      responses:
        '200': { description: Prüfergebnis }
  /compliance/integrity:
    get:
      tags: [Trips]
      summary: Verify integrity of immutable trip history
      responses:
        '200': { description: Integritätsstatus }
  /compliance/periods:
    get:
      tags: [Trips]
      summary: List closed periods
      responses:
        '200': { description: Abgeschlossene Zeiträume }
    post:
      tags: [Trips]
      summary: Close period with audit trail
      responses:
        '201': { description: Zeitraum abgeschlossen }

  /export/summary:
    get:
      tags: [Import Export]
      summary: Get export statistics and completeness notices
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [business, private, commute, unclassified] } }
      responses:
        '200': { description: Zusammenfassung }
  /export/csv:
    get:
      tags: [Import Export]
      summary: Export trips as CSV
      description: Includes UTC timestamps plus local time, IANA time zone and UTC offset (DST-aware) for start and end of each trip.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [business, private, commute, unclassified] } }
      responses:
        '200':
          description: CSV-Datei
          content:
            text/csv:
              schema: { type: string, format: binary }
  /export/gpx:
    get:
      tags: [Import Export]
      summary: Export trips as GPX
      parameters:
        - { name: tripId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: GPX-Datei
          content:
            application/gpx+xml:
              schema: { type: string, format: binary }
  /export/pdf:
    get:
      tags: [Import Export]
      summary: Export tax-oriented trip and statistics PDF report
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [business, private, commute, unclassified] } }
      responses:
        '200':
          description: PDF-Datei
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /import/csv:
    post:
      tags: [Import Export]
      summary: Import trips from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                dryRun: { type: boolean, default: false }
      responses:
        '200': { description: Importergebnis }
  /import/gpx:
    post:
      tags: [Import Export]
      summary: Import GPX
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                vehicleId: { type: string, format: uuid }
      responses:
        '200': { description: Importergebnis }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      responses:
        '200':
          description: Benutzer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Admin]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserInput' }
      responses:
        '201':
          description: Benutzer angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /admin/users/{id}:
    get:
      tags: [Admin]
      summary: Get user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
    put:
      tags: [Admin]
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Benutzer aktualisiert }
    delete:
      tags: [Admin]
      summary: Delete user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Benutzer gelöscht }
  /admin/users/{id}/totp:
    delete:
      tags: [Admin]
      summary: Disable TOTP for a user
      description: Entfernt das verschlüsselte TOTP-Secret und widerruft andere Sitzungen.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
  /admin/users/{id}/passkeys:
    delete:
      tags: [Admin]
      summary: Delete all passkeys of a user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
  /admin/users/{id}/passkeys/{passkeyId}:
    delete:
      tags: [Admin]
      summary: Delete a user's passkey
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: passkeyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
  /admin/users/{id}/sessions:
    delete:
      tags: [Admin]
      summary: Revoke a user's sessions
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Anzahl widerrufener Sitzungen
          content:
            application/json:
              schema:
                type: object
                required: [revokedSessions]
                properties:
                  revokedSessions: { type: integer, minimum: 0 }
  /admin/settings/services:
    get:
      tags: [Admin]
      summary: Get internal map service configuration
      responses:
        '200':
          description: Interne Servicekonfiguration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminServiceSettings' }
  /admin/settings/services/map:
    put:
      tags: [Admin]
      summary: Configure map source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MapServiceSettings' }
      responses:
        '200': { description: Kartenquelle gespeichert }
  /admin/settings/services/photon:
    put:
      tags: [Admin]
      summary: Configure Photon
      description: Interne Server-URLs bleiben ausschließlich im Backend gespeichert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotonServiceSettings' }
      responses:
        '200': { description: Photon-Konfiguration gespeichert }
  /admin/settings/services/overpass:
    put:
      tags: [Admin]
      summary: Configure Overpass
      description: Interne Server-URLs bleiben ausschließlich im Backend gespeichert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverpassServiceSettings' }
      responses:
        '200': { description: Overpass-Konfiguration gespeichert }
  /admin/settings/services/atlas:
    put:
      tags: [Admin]
      summary: Configure Dawarich Atlas
      description: Interne Server-URLs bleiben ausschließlich im Backend gespeichert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtlasServiceSettings' }
      responses:
        '200': { description: Atlas-Konfiguration gespeichert }
  /admin/settings/services/check:
    get:
      tags: [Admin]
      summary: System check for geocoding and routing modules
      description: Prüft mit den gespeicherten Einstellungen, welche Funktionen (Atlas, Photon, Map-Matching) verfügbar sind.
      parameters:
        - name: module
          in: query
          required: false
          schema: { type: string, enum: [atlas, geocoding, mapMatching] }
      responses:
        '200':
          description: Status je Modul
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCheckResult' }
  /admin/settings/services/test:
    post:
      tags: [Admin]
      summary: Test map service connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, config]
              properties:
                category: { type: string, enum: [map, photon, overpass, valhalla, osrm, atlas, geocoding, mapMatching] }
                config: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Testergebnis
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
                  responseTimeMs: { type: [integer, 'null'] }
                  message: { type: string }
  /admin/backup:
    post:
      tags: [Admin]
      summary: Create full backup
      responses:
        '202': { description: Backup gestartet }
  /admin/system:
    get:
      tags: [Admin]
      summary: Get system information
      responses:
        '200': { description: Systeminformationen }

  /users/me/onboarding:
    post:
      tags: [Users]
      summary: Mark the first-login assistant as completed
      description: |
        Setzt `onboardingCompleted` des eigenen Kontos. Clients zeigen den
        Einrichtungsassistenten, solange der Wert false ist.
      responses:
        '200':
          description: Aktualisiertes Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /admin/setup:
    get:
      tags: [Admin]
      summary: Get initial server setup state
      description: |
        Stand der Ersteinrichtung plus Werte, die nur über die Docker-Umgebung
        einstellbar sind (öffentliche Adresse, OAuth-Anbieter) als Status.
      responses:
        '200':
          description: Einrichtungsstatus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSetupState' }
        '401': { description: Authentication required }

  /admin/setup/complete:
    post:
      tags: [Admin]
      summary: Complete the initial server setup
      description: Markiert die Ersteinrichtung als abgeschlossen; gilt auch als abgeschlossener Assistent des eigenen Kontos.
      responses:
        '200':
          description: Abgeschlossen
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed: { type: boolean }
                  completedAt: { type: [string, 'null'], format: date-time }
                  user: { $ref: '#/components/schemas/User' }

  /admin/mail:
    get:
      tags: [Admin]
      summary: Get SMTP settings
      description: Ohne Passwort; `source` zeigt, ob die Werte aus der Datenbank oder der .env (Fallback) stammen.
      responses:
        '200':
          description: SMTP-Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
    put:
      tags: [Admin]
      summary: Save SMTP settings
      description: Ein leeres oder fehlendes Passwort lässt das gespeicherte unverändert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailSettingsUpdate' }
      responses:
        '200':
          description: Gespeicherte SMTP-Einstellungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '400': { description: Invalid request }
    delete:
      tags: [Admin]
      summary: Remove stored SMTP settings
      description: Danach gelten wieder die SMTP_*-Umgebungsvariablen, falls gesetzt.
      responses:
        '200':
          description: SMTP-Einstellungen nach dem Entfernen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }

  /admin/mail/test:
    post:
      tags: [Admin]
      summary: Send a test e-mail
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email, description: Standard ist die Adresse des angemeldeten Admins }
                settings: { $ref: '#/components/schemas/MailSettingsUpdate' }
      responses:
        '200':
          description: Gesendet
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  to: { type: string, format: email }
        '400': { description: MAIL_TEST_FAILED }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Nicht authentifiziert
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Keine Berechtigung
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ExpenseCategory:
      type: string
      enum: [fuel, charging, insurance, tax, maintenance, repair, tires, leasing, financing, parking, toll, cleaning, inspection, other]
    ExpenseInput:
      type: object
      description: Bei POST sind vehicleId, category, date und amount Pflicht. Tankfelder gelten nur für fuel/charging.
      properties:
        vehicleId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        date: { type: string, format: date }
        amount: { type: number, minimum: 0, description: Bruttobetrag in der angegebenen Währung }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: EUR }
        odometerKm: { type: [number, 'null'], minimum: 0 }
        quantity: { type: [number, 'null'], exclusiveMinimum: 0 }
        quantityUnit: { type: [string, 'null'], enum: [l, kwh, kg, null], description: Standard l (fuel) bzw. kwh (charging) }
        fuelType: { type: [string, 'null'], enum: [petrol, diesel, lpg, cng, electric, hydrogen, other, null] }
        fullTank: { type: boolean, default: false }
        periodStart: { type: [string, 'null'], format: date }
        periodEnd: { type: [string, 'null'], format: date }
        tripId: { type: [string, 'null'], format: uuid }
        vendor: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    Expense:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        vehicleName: { type: string }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        date: { type: string, format: date }
        amount: { type: number }
        amountCents: { type: integer }
        currency: { type: string }
        odometerKm: { type: [number, 'null'] }
        quantity: { type: [number, 'null'] }
        quantityUnit: { type: [string, 'null'] }
        pricePerUnit: { type: [number, 'null'] }
        fuelType: { type: [string, 'null'] }
        fullTank: { type: boolean }
        periodStart: { type: [string, 'null'], format: date }
        periodEnd: { type: [string, 'null'], format: date }
        tripId: { type: [string, 'null'], format: uuid }
        vendor: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        source: { type: string, enum: [manual, csv_import] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExpenseImportRequest:
      type: object
      required: [vehicleId, content]
      properties:
        vehicleId: { type: string, format: uuid }
        content: { type: string, format: byte, description: CSV-Datei Base64-kodiert (max. 3 MB). UTF-8 oder Windows-1252. }
        mapping:
          type: object
          description: Optionale Spaltenzuordnung Feld → Spaltenindex (0-basiert). Ohne Angabe wird sie aus der Kopfzeile erkannt.
          properties:
            date: { type: integer }
            odometer: { type: integer }
            quantity: { type: integer }
            amount: { type: integer }
            currency: { type: integer }
            tankType: { type: integer }
            costType: { type: integer }
            title: { type: integer }
            note: { type: integer }
            vendor: { type: integer }
            fuel: { type: integer }
        kind: { type: string, enum: [fuel, costs], description: Tankungen oder sonstige Kosten }
        energy: { type: string, enum: [fuel_l, fuel_kg, charging_kwh], default: fuel_l }
        dateFormat: { type: string, enum: [DD.MM.YYYY, YYYY-MM-DD, DD/MM/YYYY, MM/DD/YYYY] }
        decimalSeparator: { type: string, enum: [',', '.'] }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Währung, falls die Datei keine enthält }
    ExpenseImportMessage:
      type: object
      properties:
        line: { type: [integer, 'null'] }
        message: { type: string }
    ExpenseImportPreview:
      type: object
      properties:
        source: { type: string, enum: [spritmonitor, generic] }
        encoding: { type: string }
        delimiter: { type: string }
        headers: { type: array, items: { type: string } }
        sampleRows: { type: array, items: { type: array, items: { type: string } } }
        mapping: { type: object, additionalProperties: { type: integer } }
        options: { type: object }
        missingRequired: { type: array, items: { type: string } }
        counts:
          type: object
          properties:
            rows: { type: integer }
            valid: { type: integer }
            new: { type: integer }
            duplicates: { type: integer }
            errors: { type: integer }
            warnings: { type: integer }
            fullTanks: { type: integer }
        dateRange: { type: [object, 'null'] }
        errors: { type: array, items: { $ref: '#/components/schemas/ExpenseImportMessage' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/ExpenseImportMessage' } }
        preview: { type: array, items: { type: object } }
    ExpenseSummary:
      type: object
      properties:
        vehicleId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string }
        distance:
          type: object
          properties:
            totalKm: { type: number }
            tripCount: { type: integer }
            byTripType: { type: object, additionalProperties: { type: number } }
            shares: { type: object, additionalProperties: { type: [number, 'null'] } }
        costs:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              total: { type: number }
              costPerKm: { type: [number, 'null'] }
              byCategory:
                type: array
                items:
                  type: object
                  properties:
                    category: { $ref: '#/components/schemas/ExpenseCategory' }
                    amount: { type: number }
                    entries: { type: integer }
              byTripType: { type: object, additionalProperties: { type: [number, 'null'] } }
        energy:
          type: array
          items:
            type: object
            properties:
              unit: { type: string }
              currency: { type: string }
              quantity: { type: number }
              amount: { type: number }
              entries: { type: integer }
              averagePricePerUnit: { type: [number, 'null'] }
        consumption:
          type: array
          items:
            type: object
            properties:
              unit: { type: string }
              quantity: { type: number }
              distanceKm: { type: number }
              intervals: { type: integer }
              per100Km: { type: [number, 'null'] }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details: { type: [object, array, 'null'] }
        requestId: { type: [string, 'null'] }
    User:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        loginName: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'], maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, disabled] }
        locale: { type: string, default: de }
        timezone: { type: string, default: Europe/Berlin }
        themeMode: { type: string, enum: [light, dark, system] }
        totpEnabled: { type: boolean }
        totpRequired: { type: boolean }
        passkeyEnabled: { type: boolean }
        hasPassword: { type: boolean }
        forcePasswordChange: { type: boolean }
        onboardingCompleted: { type: boolean, description: "false: beim Login den Einrichtungsassistenten zeigen" }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPasskey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        transports:
          type: array
          items: { type: string }
        backedUp: { type: boolean }
        deviceType: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            passkeyCount: { type: integer, minimum: 0 }
            activeDeviceCount: { type: integer, minimum: 0 }
            vehicleCount: { type: integer, minimum: 0 }
            tripCount: { type: integer, minimum: 0 }
            passkeys:
              type: array
              items: { $ref: '#/components/schemas/AdminPasskey' }
    UserUpdate:
      type: object
      properties:
        loginName: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        locale: { type: string }
    AdminUserInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        loginName: { type: [string, 'null'], minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: [string, 'null'], maxLength: 120 }
        firstName: { type: [string, 'null'], maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        role: { type: string, enum: [user, admin], default: user }
        status: { type: string, enum: [active, disabled], default: active }
        locale: { type: string, default: de }
        timezone: { type: string, default: Europe/Berlin }
        themeMode: { type: string, enum: [light, dark, system], default: system }
        forcePasswordChange: { type: boolean, default: true }
        totpRequired: { type: boolean, default: false }
        passkeyEnabled: { type: boolean, default: true }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string, format: password }
        totpCode: { type: [string, 'null'], pattern: '^[0-9]{6}$' }
        deviceName: { type: [string, 'null'] }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        tokenType: { type: string, const: Bearer }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    Device:
      type: object
      required: [deviceId, lastUsedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PairOptionsResponse:
      type: object
      required: [pairId, payload, qrCodeDataUrl, expiresAt]
      properties:
        pairId: { type: string, format: uuid }
        payload: { type: string }
        qrCodeDataUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    PairRequest:
      type: object
      required: [pairId, pairToken, deviceId, deviceName, platform]
      properties:
        pairId: { type: string, format: uuid }
        pairToken: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        platform: { type: string, example: android }
        appVersion: { type: [string, 'null'] }
    PairStatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, completed, expired, cancelled] }
        tokens:
          oneOf:
            - $ref: '#/components/schemas/TokenPair'
            - type: 'null'
    Vehicle:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        licensePlate: { type: [string, 'null'] }
        vin: { type: [string, 'null'] }
        odometerKm: { type: [number, 'null'], minimum: 0 }
        color: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        bluetoothMac: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehicleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        licensePlate: { type: [string, 'null'] }
        vin: { type: [string, 'null'] }
        odometerKm: { type: [number, 'null'], minimum: 0 }
        color: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        bluetoothMac:
          type: [string, 'null']
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
    Trip:
      type: object
      required: [id, vehicleId, type, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        type: { type: string, enum: [business, private, commute, unclassified] }
        status: { type: string, enum: [recording, completed, cancelled] }
        clientTripId:
          type: [string, 'null']
          format: uuid
          description: Trip ID generated by the recording device at start (sent as clientTripId to /tracking/start).
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        startTimeZone:
          type: [string, 'null']
          example: Europe/Berlin
          description: IANA time zone in which the trip started. Falls back to the user's time zone. Format startedAt in this zone to show local time (DST-aware).
        endTimeZone:
          type: [string, 'null']
          example: Europe/Berlin
          description: IANA time zone in which the trip ended. Falls back to startTimeZone, then the user's time zone.
        timeZoneSource:
          type: [string, 'null']
          enum: [trip, user, null]
          description: trip = recorded with the trip, user = fallback to the account time zone.
        startAddress: { type: [string, 'null'] }
        endAddress: { type: [string, 'null'] }
        purpose: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        distanceKm: { type: [number, 'null'] }
        durationSeconds: { type: [integer, 'null'] }
        mapMatching:
          description: Ergebnis des Map-Matchings (null = noch nicht gematcht). Bei status applied ist distanceKm die gematchte Distanz.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TripMapMatchingSummary'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TripMapMatchingSummary:
      type: object
      required: [status, provider]
      properties:
        status: { type: string, enum: [applied, rejected, failed] }
        provider: { type: string, enum: [valhalla, osrm, atlas] }
        matchedAt: { type: string, format: date-time }
        rawDistanceMeters: { type: [integer, 'null'], description: Distanz aus den GPS-Rohpunkten }
        matchedDistanceMeters: { type: [integer, 'null'] }
        message: { type: [string, 'null'], description: Grund bei rejected/failed }
    TripMatchedRoute:
      allOf:
        - $ref: '#/components/schemas/TripMapMatchingSummary'
        - type: object
          required: [tripId, coordinates]
          properties:
            tripId: { type: string, format: uuid }
            pointCount: { type: integer }
            confidence: { type: [number, 'null'] }
            coordinates:
              type: array
              description: Route auf dem Straßennetz als [lat, lon]-Paare
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
    TripHistoryEntry:
      type: object
      required: [id, tripId, eventType, changedFields, metadata, createdAt]
      properties:
        id: { type: string }
        tripId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [CREATED, UPDATED, CLASSIFIED, ARCHIVED, DELETED, TAG_ADDED, TAG_REMOVED, MAP_MATCHED, BASELINE]
        changedFields: { type: object, additionalProperties: true }
        oldValues: { type: [object, 'null'], additionalProperties: true }
        newValues: { type: [object, 'null'], additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        actor:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, format: uuid }
                displayName: { type: [string, 'null'] }
                username: { type: [string, 'null'] }
                email: { type: [string, 'null'], format: email }
        createdAt: { type: string, format: date-time }
    TripInput:
      type: object
      required: [vehicleId, startedAt]
      properties:
        vehicleId: { type: string, format: uuid }
        type: { type: string, enum: [business, private, commute, unclassified], default: unclassified }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        startAddress: { type: [string, 'null'] }
        endAddress: { type: [string, 'null'] }
        purpose: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
    TrackPoint:
      type: object
      required: [lat, lon, recordedAt]
      properties:
        id: { type: [string, 'null'], format: uuid }
        tripId: { type: [string, 'null'], format: uuid }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        altitude: { type: [number, 'null'] }
        accuracy: { type: [number, 'null'] }
        speed: { type: [number, 'null'] }
        bearing: { type: [number, 'null'] }
        recordedAt: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: [string, 'null'] }
    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: [string, 'null'] }
    ServiceConfiguration:
      type: object
      required: [map, geocoding, overpass, updatedAt]
      properties:
        map: { $ref: '#/components/schemas/PublicMapConfig' }
        geocoding:
          type: object
          required: [searchEndpoint, reverseEndpoint]
          properties:
            enabled: { type: boolean, description: "false, wenn die Adresssuche serverseitig deaktiviert ist" }
            searchEndpoint: { type: string, example: /api/v1/geocoding/search }
            reverseEndpoint: { type: string, example: /api/v1/geocoding/reverse }
        overpass:
          type: object
          required: [nearbyEndpoint, searchRadiusMeters, maxResults]
          properties:
            nearbyEndpoint: { type: string, example: /api/v1/geocoding/nearby }
            searchRadiusMeters: { type: integer, example: 2500 }
            maxResults: { type: integer, example: 50 }
        updatedAt: { type: string, format: date-time }
        features:
          type: object
          description: Serverseitig aktivierte Funktionen. Fehlt ein Schlüssel, gilt die Funktion als nicht verfügbar.
          properties:
            expenses: { type: boolean, description: Kostenerfassung (/expenses). Derzeit nur im dev-Image aktiv. }
        channel: { type: string, enum: [dev, release] }
        setup:
          type: object
          properties:
            completed: { type: boolean, description: Ersteinrichtung des Servers abgeschlossen }
        mail:
          type: object
          properties:
            enabled: { type: boolean, description: "SMTP eingerichtet; false: E-Mail-Funktionen ausblenden" }
        gravatar:
          type: object
          properties:
            enabled: { type: boolean, description: Gravatar-Profilbilder auf dieser Instanz erlaubt }
    MailSettings:
      type: object
      properties:
        source: { type: string, enum: [database, environment, none] }
        configured: { type: boolean }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        passwordSet: { type: boolean }
        fromAddress: { type: string }
        fromName: { type: string }
    MailSettingsUpdate:
      type: object
      required: [host, fromAddress]
      properties:
        host: { type: string }
        port: { type: integer, default: 587 }
        security: { type: string, enum: [starttls, tls, none], default: starttls }
        username: { type: [string, 'null'] }
        password: { type: [string, 'null'], format: password, description: Leer = unverändert }
        clearPassword: { type: boolean }
        fromAddress: { type: string, format: email }
        fromName: { type: [string, 'null'] }
    AdminSetupState:
      type: object
      properties:
        completed: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
        environment:
          type: object
          properties:
            publicBaseUrl: { type: string }
            publicBaseUrlConfigured: { type: boolean }
            timezone: { type: string }
            oauth:
              type: object
              properties:
                google: { type: boolean }
                microsoft: { type: boolean }
                redirectUriTemplate: { type: string }
            passkeys:
              type: object
              properties:
                enabled: { type: boolean }
                rpId: { type: string }
            channel: { type: string, enum: [dev, release] }
        mail: { $ref: '#/components/schemas/MailSettings' }
        gravatar:
          type: object
          properties:
            enabled: { type: boolean }
            source: { type: string, enum: [database, environment] }
    PublicMapConfig:
      type: object
      required: [provider, type, attribution, minZoom, maxZoom, tileSize]
      properties:
        provider: { type: string, enum: [osm, maplibre, custom] }
        type: { type: string, enum: [raster, vector, style] }
        tileUrl: { type: [string, 'null'], format: uri }
        styleUrl: { type: [string, 'null'], format: uri }
        attribution: { type: string }
        minZoom: { type: integer }
        maxZoom: { type: integer }
        tileSize: { type: integer, enum: [256, 512] }
    MapServiceSettings:
      allOf:
        - $ref: '#/components/schemas/PublicMapConfig'
    PhotonServiceSettings:
      type: object
      required: [provider, timeoutMs]
      properties:
        provider:
          type: string
          enum: [disabled, public, custom, atlas]
          description: "disabled schaltet die Adresssuche ab; atlas nutzt den Photon-Passthrough von Dawarich Atlas."
        baseUrl: { type: [string, 'null'] }
        timeoutMs: { type: integer, minimum: 1000, default: 10000 }
    OverpassServiceSettings:
      type: object
      required: [provider, timeoutMs, searchRadiusMeters, maxResults]
      properties:
        provider: { type: string, enum: [public, custom] }
        interpreterUrl: { type: [string, 'null'] }
        timeoutMs: { type: integer, minimum: 1000, default: 30000 }
        searchRadiusMeters: { type: integer, minimum: 1, default: 2500 }
        maxResults: { type: integer, minimum: 1, maximum: 500, default: 50 }
    AdminServiceSettings:
      type: object
      required: [map, photon, overpass]
      properties:
        map: { $ref: '#/components/schemas/MapServiceSettings' }
        photon: { $ref: '#/components/schemas/PhotonServiceSettings' }
        overpass: { $ref: '#/components/schemas/OverpassServiceSettings' }
        atlas: { $ref: '#/components/schemas/AtlasServiceSettings' }
        mapMatching: { $ref: '#/components/schemas/MapMatchingSettings' }
    AtlasServiceSettings:
      type: object
      description: Dawarich Atlas – bündelt Photon (Geocoding) und Valhalla (Routing/Map-Matching).
      required: [enabled, timeoutMs]
      properties:
        enabled: { type: boolean, default: false }
        baseUrl: { type: string, example: "http://192.168.1.20:8484" }
        timeoutMs: { type: integer, minimum: 1000, maximum: 120000, default: 10000 }
    MapMatchingSettings:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [disabled, valhalla, osrm, atlas] }
        osrmUrl: { type: string }
        valhallaUrl: { type: string }
    ServiceCheckResult:
      type: object
      required: [checkedAt, modules]
      properties:
        checkedAt: { type: string, format: date-time }
        modules:
          type: array
          items:
            type: object
            required: [module, label, provider, state, message]
            properties:
              module: { type: string, enum: [atlas, geocoding, mapMatching] }
              label: { type: string }
              provider: { type: string, example: atlas }
              providerLabel: { type: string }
              state: { type: string, enum: [available, starting, unavailable, inactive, misconfigured] }
              message: { type: string }
              details:
                type: [object, 'null']
                description: Bei Atlas Version, Gesamtstatus und Fähigkeiten (geocoding, routing, pois, transit → up/starting/down).
                additionalProperties: true
              responseTimeMs: { type: [integer, 'null'] }
