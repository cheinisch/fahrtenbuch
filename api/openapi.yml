                  duplicates: { type: integer }
                  errors: { type: array, items: { $ref: '#/components/schemas/ExpenseImportMessage' } }
                  warnings: { type: array, items: { $ref: '#/components/schemas/ExpenseImportMessage' } }
        '400': { description: Ungültige CSV-Datei oder Spalten für Datum/Betrag fehlen (MAPPING_INCOMPLETE) }
        '404': { description: Fahrzeug nicht gefunden }
