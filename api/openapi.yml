      summary: Map matching status
      description: Ob Map-Matching konfiguriert ist und wie viele Fahrten gematcht, abgelehnt, fehlgeschlagen oder offen sind.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, provider, trips]
                properties:
                  enabled: { type: boolean }
                  provider: { type: string, enum: [disabled, valhalla, osrm, atlas] }
                  reason: { type: [string, 'null'] }
                  trips:
                    type: object
                    properties:
                      missing: { type: integer }
                      applied: { type: integer }
                      rejected: { type: integer }
                      failed: { type: integer }
    post:
      tags: [Admin]
      summary: Start map matching job
      description: Reiht abgeschlossene Fahrten zum Map-Matching ein. Fahrten in abgeschlossenen Zeiträumen werden übersprungen.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [missing, failed, all], default: missing }
                limit: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '202':
          description: Eingereiht
          content:
            application/json:
              schema:
                type: object
                required: [queued, selected, mode]
                properties:
                  queued: { type: integer }
                  selected: { type: integer }
                  mode: { type: string }
                  provider: { type: string }
        '400': { description: Map-Matching ist nicht konfiguriert (MAP_MATCHING_DISABLED) }
