  /expenses/summary:
    get:
      tags: [Expenses]
      summary: Get cost summary for a vehicle
      description: >-
        Gesamtkosten je Kategorie und Währung, Kosten pro km, Kostenanteil je Fahrtart (nach gefahrenen km),
        Energiemengen und Durchschnittsverbrauch (Volltank-Methode). Kosten mit Leistungszeitraum werden
        tagesgenau anteilig verteilt. Standardzeitraum ist das aktuelle Kalenderjahr in der Kontozeitzone.
      parameters:
        - { name: vehicleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Kostenauswertung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseSummary' }
  /expenses/import/preview:
    post:
      tags: [Expenses]
      summary: Preview CSV import of vehicle expenses
      description: >-
        Liest eine CSV-Datei (z. B. Spritmonitor-Export von Tankungen oder Kosten, deutsch oder englisch)
        und liefert erkannte Spaltenzuordnung, Formate, Zählwerte, Fehler/Hinweise und eine Vorschau.
        Es wird nichts gespeichert. Bereits vorhandene Einträge werden als Duplikate erkannt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseImportRequest' }
      responses:
        '200':
          description: Importvorschau
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseImportPreview' }
        '400': { description: Ungültige oder leere CSV-Datei }
        '404': { description: Fahrzeug nicht gefunden }
  /expenses/import:
    post:
      tags: [Expenses]
      summary: Import vehicle expenses from CSV
      description: >-
        Importiert alle gültigen, noch nicht vorhandenen Zeilen in einer Transaktion (Quelle csv_import).
        Fehlerhafte Zeilen werden übersprungen und gemeldet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseImportRequest' }
      responses:
        '201':
          description: Import abgeschlossen
          content:
